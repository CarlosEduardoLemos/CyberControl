name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Ruff
        run: |
          set +e
          ruff check . --output-format=json > ruff-results.json
          status=$?
          echo "RUFF_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-${{ matrix.python-version }}
          path: ruff-results.json
      - name: Fail if Ruff failed
        run: exit "$RUFF_STATUS"

      - name: Tests
        env:
          SECRET_KEY: ci-only-secret-key
        run: python -m unittest discover -v tests
      - name: Coverage
        run: coverage run -m unittest discover tests && coverage report -m
