name: Security

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: |
          set +e
          bandit -r app_modules cybercontrol.py -ll -f json -o bandit-results.json
          status=$?
          echo "BANDIT_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Upload Bandit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-diagnostics
          path: bandit-results.json
      - name: Fail if Bandit failed
        run: exit "$BANDIT_STATUS"
      - name: Dependency audit
        run: pip-audit -r requirements.txt
