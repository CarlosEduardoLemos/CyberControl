{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <h2>🛡️ VulnManager</h2>
            <p class="text-muted">Sistema de Gestão de Vulnerabilidades</p>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Entrar</h4>
                <form method="POST">
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <p class="mt-3 mb-0 text-center">
                    Não tem conta? <a href="{{ url_for('register') }}">Cadastre-se</a>
                </p>
            </div>
        </div>
        <p class="text-center text-muted mt-3 small">
            O primeiro usuário cadastrado no sistema se torna Administrador automaticamente.
        </p>
    </div>
</div>
{% endblock %}
